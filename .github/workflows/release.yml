name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release and upload the archives

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: build every platform
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # The version is stamped explicitly rather than left to Go's VCS
          # metadata: a package manager building from an extracted archive has
          # no .git, and `regesto version` has to agree with the release it
          # came from wherever it was built.
          flags="-s -w -X github.com/prof18/regesto/internal/version.stamped=${VERSION}"
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "building ${os}/${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$flags" -o "dist/regesto" ./cmd/regesto
            tar -czf "dist/regesto_${VERSION}_${os}_${arch}.tar.gz" -C dist regesto
            rm dist/regesto
          done
          cd dist && shasum -a 256 *.tar.gz > checksums.txt
          cat checksums.txt

      # A release binary that cannot scaffold an instance is worse than no
      # release. Prove the artifact itself works before publishing it.
      #
      # The version assertion is not ceremony: `-X` against a symbol that does
      # not exist is silently ignored, so renaming or moving `version.stamped`
      # would produce releases reporting "unknown" with nothing failing. This is
      # the only thing that catches it.
      - name: smoke-test the artifact
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          archive="dist/regesto_${VERSION}_linux_amd64.tar.gz"
          [ "$(tar -tzf "$archive")" = "regesto" ] || { echo "release archive must contain exactly regesto"; exit 1; }
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin"
          test -f "$RUNNER_TEMP/bin/regesto" -a -x "$RUNNER_TEMP/bin/regesto"
          [ "$(find "$RUNNER_TEMP/bin" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = "1" ]
          # On PATH, because that is how a release is installed and how an
          # instance's shims are meant to find it — an instance carries no
          # binary of its own.
          export PATH="$RUNNER_TEMP/bin:$PATH"
          export HOME="$RUNNER_TEMP/home"

          mkdir -p "$HOME/.claude/projects/release/memory" "$HOME/.codex/memories"
          printf '%s\n' 'claude release preface' > "$HOME/.claude/CLAUDE.md"
          printf '%s\n' 'codex release preface' > "$HOME/.codex/AGENTS.md"

          got="$(regesto version)"
          echo "reports: $got"
          [ "$got" = "regesto ${VERSION}" ] || { echo "version mismatch"; exit 1; }

          regesto init --dir "$RUNNER_TEMP/kb" --machine ci --examples
          "$RUNNER_TEMP/kb/bin/regesto-index"
          "$RUNNER_TEMP/kb/bin/regesto-search" --scope aurora | grep -q dec-http-port-8080

          cp "$HOME/.claude/CLAUDE.md" "$RUNNER_TEMP/release-claude-before.md"
          cp "$HOME/.codex/AGENTS.md" "$RUNNER_TEMP/release-codex-before.md"
          regesto --config "$RUNNER_TEMP/kb/config.toml" install --dry-run --json > "$RUNNER_TEMP/release-install-dry.json"
          cmp "$HOME/.claude/CLAUDE.md" "$RUNNER_TEMP/release-claude-before.md"
          cmp "$HOME/.codex/AGENTS.md" "$RUNNER_TEMP/release-codex-before.md"
          test ! -e "$HOME/.claude/settings.json"
          test ! -e "$HOME/.claude/skills/regesto-search"
          test ! -e "$RUNNER_TEMP/kb/.state/integrations"
          regesto --config "$RUNNER_TEMP/kb/config.toml" install --json > "$RUNNER_TEMP/release-install.json"
          regesto --config "$RUNNER_TEMP/kb/config.toml" install --dry-run --json > "$RUNNER_TEMP/release-install-current.json"
          regesto --config "$RUNNER_TEMP/kb/config.toml" doctor --json > "$RUNNER_TEMP/release-doctor.json"
          regesto --config "$RUNNER_TEMP/kb/config.toml" doctor --json > "$RUNNER_TEMP/release-doctor-repeat.json"
          cmp "$RUNNER_TEMP/release-doctor.json" "$RUNNER_TEMP/release-doctor-repeat.json"

          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release-smoke","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            '{"jsonrpc":"2.0","id":3,"method":"resources/list","params":{}}' \
            '{"jsonrpc":"2.0","id":4,"method":"resources/read","params":{"uri":"regesto://index"}}' \
            | regesto --config "$RUNNER_TEMP/kb/config.toml" mcp > "$RUNNER_TEMP/release-mcp.jsonl"

          python3 - "$RUNNER_TEMP/release-install-dry.json" "$RUNNER_TEMP/release-install.json" "$RUNNER_TEMP/release-install-current.json" "$RUNNER_TEMP/release-doctor.json" "$RUNNER_TEMP/release-mcp.jsonl" <<'PY'
          import json
          import sys

          dry, applied, current, doctor, transcript = sys.argv[1:]
          with open(dry, encoding="utf-8") as stream:
              dry_report = json.load(stream)
          assert dry_report["dry_run"] is True and "result" not in dry_report
          with open(applied, encoding="utf-8") as stream:
              applied_report = json.load(stream)
          assert applied_report["result"]["applied"] > 0
          with open(current, encoding="utf-8") as stream:
              current_report = json.load(stream)
          assert all(item["action"] in {"current", "skip", "manual"} for item in current_report["plan"]["items"])
          with open(doctor, encoding="utf-8") as stream:
              doctor_report = json.load(stream)
          configured = {item["id"]: item for item in doctor_report["integrations"] if item["configured"]}
          assert set(configured) == {"claude", "codex"}
          for item in configured.values():
              assert item["status"] == "ok"
              assert item["capabilities"]["skills"]["status"] == "ok"
              assert item["capabilities"]["instructions"]["status"] == "ok"
              assert item["capabilities"]["trust"]["status"] == "ok"
              assert all(artifact["action"] == "current" for artifact in item["artifacts"])
          assert configured["claude"]["capabilities"]["hooks"][0]["status"] == "ok"
          assert configured["codex"]["capabilities"]["hooks"][0]["status"] == "unsupported"
          assert all(check["status"] == "ok" for check in doctor_report["checks"])
          with open(transcript, encoding="utf-8") as stream:
              messages = [json.loads(line) for line in stream]
          assert [message["id"] for message in messages] == [1, 2, 3, 4]
          assert all(message["jsonrpc"] == "2.0" and "result" in message for message in messages)
          assert messages[0]["result"]["protocolVersion"] == "2025-06-18"
          assert [tool["name"] for tool in messages[1]["result"]["tools"]] == [
              "regesto_search", "regesto_get_fact", "regesto_resolve_project", "regesto_write_fact"
          ]
          assert messages[2]["result"]["resources"][0]["uri"] == "regesto://index"
          assert "# INDEX" in messages[3]["result"]["contents"][0]["text"]

          PY

      # A release publishes what CHANGELOG.md says about it, and will not publish
      # without it. Generated commit lists are written for whoever maintains the
      # code and read as noise to everyone else — and the release page is where
      # people land, most of whom will never open the repository.
      - name: take the notes from the changelog
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          section="${VERSION#v}"
          awk -v want="## $section" '
            $0 == want { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md has no '## $section' section."
            echo "Add one describing what changed for someone using this, then re-tag."
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" dist/*.tar.gz dist/checksums.txt \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
